<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1C1A3A" />
    <title>Sin conexión — ESPOLCLUB</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f7f6fa;
        color: #1c1a3a;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #131128; color: #f7f6fa; }
        .card { background: #1d1a38 !important; border-color: #35315c !important; }
        .muted { color: #b4b0cf !important; }
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #d4d0de;
        border-radius: 14px;
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: system-ui, sans-serif;
        font-weight: 800;
        font-size: 24px;
        line-height: 30px;
      }
      .muted { margin: 0; color: #55517a; font-size: 14px; line-height: 21px; }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #1c1a3a;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #e8e4f4; color: #1c1a3a; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/Kokoa.svg" alt="" width="87" height="40" />
      <h1>Sin conexión</h1>
      <p class="muted">
        ESPOLCLUB necesita internet para mostrar los clubes y los eventos.
        Tus credenciales QR ya descargadas siguen sirviendo en la entrada del evento.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
