<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#001A43" />
    <title>Sin conexión — ESPOLCLUB</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f6f7f9;
        color: #161a22;
        font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #080d18; color: #e8ecf5; }
        .card { background: #101828 !important; border-color: #243149 !important; }
        .muted { color: #96a1b8 !important; }
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border: 1px solid #dcdee4;
        border-radius: 14px;
        padding: 32px 28px;
        text-align: center;
      }
      h1 {
        margin: 20px 0 8px;
        font-family: Spectral, Georgia, serif;
        font-size: 24px;
        line-height: 30px;
      }
      .muted { margin: 0; color: #565c6b; font-size: 14px; line-height: 21px; }
      button {
        margin-top: 24px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 10px;
        background: #001a43;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #5b8def; color: #04101f; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <svg width="44" height="57" viewBox="0 0 100 130" aria-hidden="true">
        <path d="M0 0 H100 V130 L50 101.4 L0 130 Z" fill="#001A43" />
      </svg>
      <h1>Sin conexión</h1>
      <p class="muted">
        ESPOLCLUB necesita internet para mostrar los clubes y los eventos.
        Tus credenciales QR ya descargadas siguen sirviendo en la entrada del evento.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
