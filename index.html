<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Panel web de ESPOLCLUB para líderes de club y la Gerencia de Bienestar Politécnico." />
    <meta name="color-scheme" content="light dark" />
    <title>ESPOLCLUB</title>
    <script>
      // Resuelve el tema antes del primer pintado para evitar el destello.
      // localStorage guarda la PREFERENCIA (system|light|dark);
      // data-theme en <html> guarda el tema RESUELTO (light|dark).
      (function () {
        try {
          var mode = localStorage.getItem('theme_mode') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
